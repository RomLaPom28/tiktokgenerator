<title>Studio La Ferme</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Carnet de tournage : une colonne mobile, cartes de plans numérotées comme des claps, une seule couleur d'action */
:root{
  --bg:#f3f0ea; --surface:#fffdf9; --ink:#1b1a17; --mute:#6f6a60; --line:#e2dccf;
  --clap:#d8432b; --clap-ink:#ffffff; --ok:#2e7d4f; --ok-bg:#e3f1e8; --wait:#a86a12; --wait-bg:#f8ecd6;
  --bad:#b3261e; --bad-bg:#f9e1de;
  --display:"Archivo","Arial Black",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1e1c19; --ink:#f2efe8; --mute:#a39d91; --line:#34302a;
  --clap:#ec5a40; --ok:#5cc28a; --ok-bg:#1c3226; --wait:#e2a64a; --wait-bg:#3a2c14; --bad:#ff8a7a; --bad-bg:#3d1c18; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311; --surface:#1e1c19; --ink:#f2efe8; --mute:#a39d91; --line:#34302a;
  --clap:#ec5a40; --ok:#5cc28a; --ok-bg:#1c3226; --wait:#e2a64a; --wait-bg:#3a2c14; --bad:#ff8a7a; --bad-bg:#3d1c18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font:900 22px/1 var(--display);letter-spacing:-.01em;margin:0;text-transform:uppercase;flex:1}
header h1 span{color:var(--clap)}
header .back,.nav a{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 11px;font:600 14px var(--body);cursor:pointer;text-decoration:none}
.nav{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.nav a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.lbl{font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
h2{font:800 20px/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
h3{font:800 16px/1.2 var(--display);margin:0 0 6px}
p{margin:0}
.mute{color:var(--mute)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:9px 10px;font:15px/1.4 var(--body)}
textarea{min-height:70px;resize:vertical}
textarea.big{min-height:180px;font-size:14px}
label.f{display:block;font:600 12px/1.2 var(--body);color:var(--mute);margin:10px 0 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:11px;padding:12px 10px;font:700 14px var(--body);cursor:pointer;background:var(--clap);color:var(--clap-ink);text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 10px;font-size:13px}
.btn.done{background:var(--ok);color:#fff}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.ep:focus-visible,.back:focus-visible,.nav a:focus-visible{outline:3px solid var(--clap);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}
.ep{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;color:var(--ink);font:inherit}
.num{flex:none;width:46px;height:46px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:900 18px/1 var(--display);
  background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.14) 7px 14px)}
.ep .t{flex:1;min-width:0}.ep .t b{display:block;font:800 16px/1.2 var(--display)}
.chip{display:inline-block;font:700 12px/1 var(--body);padding:5px 8px;border-radius:999px;background:var(--wait-bg);color:var(--wait);margin-top:5px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.role{background:var(--bg);color:var(--mute);border:1px solid var(--line);margin:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.plan .top{display:flex;gap:10px;align-items:flex-start}
.plan .n{flex:none;font:900 24px/1 var(--display);color:var(--clap);min-width:34px;font-variant-numeric:tabular-nums}
.plan .n small{display:block;font:600 11px/1.4 var(--body);color:var(--mute)}
.plan.got .n{color:var(--ok)}
.plan .what{flex:1;min-width:0}
.plan .tech{font-size:12px;color:var(--mute);margin-top:3px}
.plan .say{margin-top:6px;font-size:15px}
.plan .say b{font-weight:700}
.plan .acts{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan .full{grid-column:1/-1}
.plan video{width:84px;height:150px;object-fit:cover;border-radius:8px;background:#000;flex:none}
.overlay{margin-top:8px;font-size:13px;background:var(--wait-bg);color:var(--wait);border-radius:8px;padding:6px 9px;font-weight:600}
.edit{margin-top:10px;border-top:1px dashed var(--line);padding-top:4px}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.final video{width:100%;max-height:70vh;border-radius:12px;background:#000;display:block}
.final img{border-radius:10px;width:120px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:600 14px var(--body);z-index:20;max-width:calc(100% - 32px);text-align:center}
.empty{text-align:center;padding:28px 14px}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:8px}
details.sec>summary{font:800 16px/1.2 var(--display);color:var(--ink);margin:0;list-style:none;display:flex;justify-content:space-between}
details.sec>summary::after{content:"+";color:var(--clap)}
details.sec[open]>summary::after{content:"–"}
pre{white-space:pre-wrap;font:12px/1.45 ui-monospace,Consolas,monospace;margin:6px 0 0;color:var(--ink);overflow-wrap:anywhere}
.checks{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .k{flex:none;font:800 10px/1 var(--body);padding:4px 6px;border-radius:6px;letter-spacing:.04em;margin-top:1px}
.k.ECHEC{background:var(--bad-bg);color:var(--bad)}.k.AVOIR{background:var(--wait-bg);color:var(--wait)}.k.OK{background:var(--ok-bg);color:var(--ok)}
.checks span.m{color:var(--mute);overflow-wrap:anywhere}
.progress{font:600 13px var(--body);color:var(--mute);margin-top:8px;white-space:pre-wrap}
.perso{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.perso>summary{font-weight:700;cursor:pointer;list-style:none}
.perso>summary small{font-weight:500;color:var(--mute)}
.timeline{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:6px}
.timeline div{display:flex;gap:8px}.timeline b{flex:none;width:44px;font-variant-numeric:tabular-nums;color:var(--clap)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid var(--line)}
.confirm{display:flex;gap:8px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header><button class="back" id="back" hidden>← Retour</button><h1>La Ferme <span>Studio</span></h1></header>
  <nav class="nav" id="nav"><a href="#" data-v="">Séries</a><a href="#nouveau" data-v="nouveau">Créer</a><a href="#tendances" data-v="tendances">Tendances</a><a href="#regles" data-v="regles">Règles TikTok</a></nav>
  <main id="app" class="stack"><div class="card empty mute">Chargement du studio…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================== état ================== */
const app=document.getElementById("app"), backBtn=document.getElementById("back"), toastEl=document.getElementById("toast"), nav=document.getElementById("nav");
let db=null, assets=null, downloads=null, sample=null;
let episodes=[], clips={}, demandes=[], B={}, view="", open={}, busy={}, gen=null, confirmDel=null, bibleLoaded=false;
let G={}, series=[], tendances=[], cur="laferme", imgOK=false;
let wiz={niche:"foot",type:"serie",style:"animaux",ton:"drama drôle",idee:"",concepts:null,busy:false,progress:""};
const STYLES={animaux:"Animaux anthropomorphes en 3D, rendu cinéma réaliste type film d'animation haut de gamme, fourrure et plumes très détaillées, vêtements réalistes, expressions faciales très marquées. Lumière de cinéma, profondeur de champ, étalonnage chaud et contrasté. Pas de style enfantin.",
  fruits:"Fruits et objets anthropomorphes en 3D (visage expressif, bras et jambes fins), rendu cinéma réaliste type film d'animation haut de gamme, textures très détaillées, vêtements et accessoires réalistes, expressions très marquées. Lumière de cinéma, profondeur de champ.",
  humains:"Personnages humains stylisés en 3D type film d'animation haut de gamme, proportions légèrement caricaturales, peau et tissus détaillés, expressions très marquées. Lumière de cinéma, profondeur de champ, étalonnage contrasté.",
  anime:"Style animé japonais (shonen) en 2D haut de gamme, traits nets, couleurs saturées, effets d'énergie et de vitesse, cadrages dynamiques, expressions exagérées."};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(t,ms){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.hidden=true,ms||2000)}
async function copy(text,btn){
  try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(_){}ta.remove()}
  if(btn){btn.classList.add("done");try{localStorage.setItem("c-"+btn.dataset.k,"1")}catch(e){}}
  toast("Copié");
}
function wasCopied(k){try{return localStorage.getItem("c-"+k)==="1"}catch(e){return false}}
const SUB_COLORS=[["#FFD23F","jaune"],["#FF5A5F","rouge"],["#3EC1D3","cyan"],["#FF9F1C","orange"],["#B388FF","violet"],["#06D6A0","vert"],["#F15BB5","rose"],["#FFFFFF","blanc"]];

/* ================== séries ================== */
const sid=s=>norm(s).replace(/\s+/g,"-").slice(0,30)||("serie-"+Date.now());
function seriesList(){return [{id:"laferme",nom:"La Ferme",type:"serie",niche:"animaux · drame de quartier",legacy:true},...series]}
const serieOf=id=>seriesList().find(s=>s.id===id);
const isUnique=()=>serieOf(cur)?.type==="unique";
function bibleOf(id){const s=serieOf(id); if(!s) return {};
  const b=s.legacy?{personnages:G.personnages,lieux:G.lieux,saison:G.saison,serie:G.serie,recettes:G.recettes}:(s.bible||{});
  return {...b,realisation:G.realisation,conformite:G.conformite}}
function setCur(id){if(serieOf(id)){cur=id;B=bibleOf(id)}}
const epsOf=id=>episodes.filter(e=>(e.serie||"laferme")===id);
const docId=(id,n)=>id==="laferme"?"ep"+String(n).padStart(3,"0"):`${id}-ep${String(n).padStart(3,"0")}`;
async function saveBibleDoc(doc,data){
  const s=serieOf(cur);
  if(s.legacy) return db.collection("bible").doc(doc).set(data);
  return db.collection("series").doc(cur).update({bible:{...(s.bible||{}),[doc]:data}});
}
const tendOf=niche=>tendances.filter(t=>!niche||norm(t.niche).includes(norm(niche).split(" ")[0])||norm(niche).includes(norm(t.niche))).slice(0,8);
const tendTxt=list=>list.length?list.map(t=>`- [${t.niche}] ${t.note||""}${t.vues?` (${t.vues} vues)`:""}${t.fiche?`\n  Analyse : ${t.fiche}`:""}`).join("\n"):"aucune";

/* ================== bible ================== */
const persos=()=>Object.fromEntries((B.personnages?.personnages||[]).map(p=>[p.id,p]));
const ordre=()=>(B.personnages?.personnages||[]).map(p=>p.id);
const lieux=()=>Object.fromEntries((B.lieux?.lieux||[]).map(l=>[l.id,l]));
const R=()=>B.realisation||{};
const C=()=>B.conformite||{rouge:{},orange:[],max_orange:2,appats_interdits:[],remplacements:{}};
const nomDe=id=>persos()[id]?.nom||id;
const tenue=(id,t)=>{const p=persos()[id];if(!p)return"";return p.tenues?.[t||"base"]||p.tenues?.base||""};
const phrase=s=>{s=(s||"").trim();return s?s[0].toUpperCase()+s.slice(1):s};
const point=s=>phrase(s).replace(/\.+$/,"")+".";

function promptImage(p){
  const r=R(), l=lieux()[p.lieu]||{desc:p.lieu}, P=persos();
  const m=[`Image ${p.n} : ${r.cadrages?.[p.cadrage]||p.cadrage}, ${r.angles?.[p.angle||"face"]||p.angle}.`,`Décor : ${l.desc}.`,`Lumière : ${r.lumieres?.[p.lumiere]||p.lumiere}.`];
  for(const x of p.persos||[]){const q=P[x.id]; if(!q) continue;
    m.push(`${q.adn}, ${tenue(x.id,x.tenue)} : ${x.jeu}${x.id===p.parle&&p.replique?", la bouche entrouverte comme s'il ou elle parlait":""}.`)}
  if(p.detail_image) m.push(point(p.detail_image));
  m.push("Même style et mêmes personnages que les images précédentes. Vertical 9:16, aucun texte, aucun sous-titre, aucun logo.");
  return m.join(" ");
}
function promptGrok(p){
  const r=R(), l=lieux()[p.lieu]||{son:""}, P=persos();
  const L=[`Mouvement : ${point(p.mouvement)}`,`Caméra : ${r.cameras?.[p.camera]||p.camera}.`];
  if(p.replique){const q=P[p.parle]||{nom:p.parle,voix:""};
    L.push(`Dialogue en français : ${q.nom} (${q.voix}, ${p.emotion||"naturel"}) dit : « ${p.replique} »\nLèvres synchronisées, une seule personne parle, les autres se taisent.`)}
  else L.push("Pas de dialogue, seulement des réactions et des bruits.");
  L.push(`Son : ${[l.son,p.son].filter(Boolean).join(", ")}, pas de musique.`);
  L.push("Garder exactement l'apparence des personnages et le décor de l'image.");
  return L.join("\n");
}
function ouverture(src){
  const P=persos(), t={};
  for(const pl of src.plans||[]) for(const x of pl.persos||[]){if(!P[x.id])continue;(t[x.id]=t[x.id]||[]);const v=tenue(x.id,x.tenue);if(!t[x.id].includes(v))t[x.id].push(v)}
  const ids=Object.keys(t).sort((a,b)=>ordre().indexOf(a)-ordre().indexOf(b));
  const fiches=ids.map(id=>`- ${P[id].adn}. Tenue${t[id].length>1?"s":""} : ${t[id].join(" / ")}.`).join("\n");
  return "Tu vas générer les images d'une série. Toutes les images : format vertical 9:16, même style, mêmes personnages avec EXACTEMENT les mêmes visages, couleurs et accessoires d'une image à l'autre. Aucun texte, aucun sous-titre, aucun logo dans l'image.\n\n"+
    `STYLE : ${B.personnages?.style||""}\n\nPERSONNAGES DE CET ÉPISODE (looks fixes) :\n${fiches}\n\n`+
    "Si je joins des images de référence, ce sont ces personnages : respecte-les à la lettre.\nJe vais t'envoyer \"Image 1 : …\", \"Image 2 : …\". Pour chaque message, génère uniquement l'image demandée, sans commentaire. Réponds juste OK à ce message.";
}
function fichePersos(src){
  const P=persos(), ids=[...new Set((src.plans||[]).flatMap(p=>(p.persos||[]).map(x=>x.id)))].filter(id=>P[id]);
  return ids.map(id=>({id,nom:P[id].nom,prompt:`Portrait de référence, vertical 9:16, plan américain de face sur fond neutre gris clair, lumière de studio douce. ${B.personnages?.style||""} ${P[id].adn}, ${P[id].tenues?.base||""}. Expression neutre, regard caméra. Aucun texte.`}));
}
const tps=n=>{const s=(n-1)*6;return `${Math.floor(s/60)}:${pad(s%60)}`};
function ficheMontage(src){
  const ids=[...new Set((src.plans||[]).filter(p=>p.replique).map(p=>p.parle))];
  const col=Object.fromEntries(ids.map((id,i)=>[id,SUB_COLORS[ordre().indexOf(id)%SUB_COLORS.length]||SUB_COLORS[i]]));
  const qm=src.question_milieu||{};
  const L=[`ÉPISODE ${src.numero} · ${src.titre}`,"",
    "1. Importer les clips 01 à "+pad((src.plans||[]).length)+" dans l'ordre. Couper chaque clip juste avant la 1re syllabe et juste après la dernière (zéro blanc). Durée cible : 61 à 72 s.",
    `2. 0:00-0:03 · texte d'accroche en haut, gros, blanc contour noir : « ${src.texte_accroche||src.titre_couverture||""} »`,
    isUnique()?"3. Pas de numéro de partie (vidéo unique).":`3. Petit texte permanent en haut à gauche : « Partie ${src.numero} »`];
  if(qm.texte) L.push(`4. Plan ${qm.plan} (≈${tps(qm.plan)}) · texte au centre 2 s : « ${qm.texte} »`);
  L.push(isUnique()?`5. Dernier plan · la chute, puis 1 s avec la question : « ${(src.commentaire_epingle||"").split("?")[0]}? ». Faire en sorte que la dernière image ressemble à la première (boucle = revisionnage).`
    :`5. Dernier plan · couper au milieu du geste/de la phrase, puis 1 s noir avec : « Partie ${src.numero+1} ? » + « ${(src.commentaire_epingle||"").split("?")[0]}? »`,
    "6. Sous-titres auto CapCut (français), 2 à 4 mots par ligne, une couleur par personnage :");
  for(const id of ids) L.push(`   - ${nomDe(id)} : ${col[id][1]} (${col[id][0]})`);
  L.push("7. Musique tension en fond à 10-15 % du volume (bibliothèque CapCut/TikTok uniquement), coupée sur la dernière seconde.",
    "8. Effets : zoom léger (110 %) sur les répliques choc, petit « whoosh » sur les retournements, pas d'effet choc soudain.",
    "9. Export 1080×1920, 30 i/s, sans filigrane.");
  return L.join("\n");
}
function publication(src){return ((src.legende||"")+"\n\n"+(src.hashtags||[]).join(" ")).trim()}

/* ================== vérificateur (port de outils/verifier.py + conformité) ================== */
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g,"").trim();
const words=s=>" "+String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim()+" ";
const trouve=(t,list)=>{const w=words(t);return (list||[]).filter(m=>w.includes(words(m)))};
const PROCHES=new Set(["TGP","GP","PR"]);
function runs(arr,pred){let best=0,cur=0,prev;for(const x of arr){cur=(x===prev)?cur+1:1;prev=x;if(!pred||pred(x))best=Math.max(best,cur)}return best}
function mostCommon(a){const c={};a.forEach(x=>c[x]=(c[x]||0)+1);return Object.entries(c).sort((x,y)=>y[1]-x[1])[0]?.[0]}
function verifier(src){
  const res=[], ok=(c,regle,mes,niv)=>res.push({niv:c?"OK":(niv||"ECHEC"),regle,mes:String(mes??"")});
  const r=R(), P=persos(), Lx=lieux(), plans=src.plans||[];
  const hist=isUnique()?[]:epsOf(cur).filter(e=>e.source&&e.numero<src.numero).map(e=>e.source).sort((a,b)=>a.numero-b.numero);
  ok(plans.length>=11&&plans.length<=13,"11 à 13 plans",plans.length);
  const err=[];
  for(const p of plans){
    for(const [ch,tab] of [["lieu",Lx],["lumiere",r.lumieres||{}],["cadrage",r.cadrages||{}],["angle",r.angles||{}],["camera",r.cameras||{}]])
      if(!(p[ch] in tab)) err.push(`plan ${p.n} ${ch}=${p[ch]}`);
    for(const x of p.persos||[]){ if(!P[x.id]) err.push(`plan ${p.n} perso inconnu ${x.id}`);
      else if(!((x.tenue||"base") in (P[x.id].tenues||{}))) err.push(`plan ${p.n} tenue ${x.tenue} de ${x.id}`);
      if(!x.jeu) err.push(`plan ${p.n} jeu vide ${x.id}`)}
    if(p.replique&&!(p.persos||[]).some(x=>x.id===p.parle)) err.push(`plan ${p.n} : ${p.parle} parle hors image`);

function promptConcepts(){
  const K=G.concepts||{}, c=G.conformite||{};
  return `Tu es directeur de création d'un studio qui fait des vidéos TikTok virales en IA (images ChatGPT + animation Grok, 61-72 s, beaucoup de dialogue car Grok anime mal les actions complexes).

Propose 3 concepts DIFFÉRENTS. Chaque concept DOIT partir d'un concept prouvé de la bibliothèque (garder la mécanique, changer l'univers) et s'appuyer si possible sur les tendances repérées. Rien au hasard : chaque choix est justifié par une preuve.

=== BIBLIOTHÈQUE DE CONCEPTS PROUVÉS ===
${(K.concepts||[]).map(k=>`- ${k.id} : ${k.nom}. Preuve : ${k.preuve} Mécanique : ${k.mecanique} Structure : ${k.structure} Risques : ${k.risques}`).join("\n")}

=== ARCHÉTYPES ===
${Object.entries(K.archetypes||{}).map(([k,v])=>k+" : "+v.join(", ")).join("\n")}
=== SITUATIONS ===
${Object.entries(K.situations||{}).map(([k,v])=>k+" : "+v.join(", ")).join("\n")}

${tendTxt(tendOf(wiz.niche))}

=== RÈGLES ===
${[...(K.regles_generiques||[]),...(c.regles_ecriture||[])].map(x=>"- "+x).join("\n")}

Réponds UNIQUEMENT en JSON :
{"concepts":[{"nom":"nom de la série, 1-3 mots, inventé","logline":"le concept en une phrase","concept_id":"id de la bibliothèque","pourquoi":["3 raisons, chacune reliée à une preuve ou une tendance"],"casting":[{"nom":"prénom inventé","role":"archétype","look":"animal/objet/physique + signe distinctif"}],"accroche_exemple":"1re réplique de la 1re vidéo","fin_exemple":"comment se termine la 1re vidéo","tendances_utilisees":["…"],"risques":"risque TikTok et comment on l'évite"}]}`;
}
function promptBible(k){
  const R0=G.realisation||{};
  return `Tu es showrunner. Crée la BIBLE complète de ${wiz.type==="unique"?"cette vidéo unique (on pourra en faire d'autres avec le même casting)":"cette série TikTok"} à partir du concept choisi. Tout doit être cohérent, réutilisable d'un épisode à l'autre et décrit pour qu'une IA d'image redessine EXACTEMENT les mêmes personnages.

CONCEPT CHOISI : ${JSON.stringify(k)}
Niche : ${wiz.niche}. Ton : ${wiz.ton}.
STYLE VISUEL : ${STYLES[wiz.style]||wiz.style}

Règles :
- 5 à 7 personnages, chacun un archétype net et VISUELLEMENT très distinct (couleur dominante, accessoire signature). "adn" = description physique précise et fixe en une phrase, commençant par le prénom (espèce/forme, couleurs, signes distinctifs, accessoires). Tenues "base", "chic", "nuit" (jamais suggestives). "voix" = âge, timbre, accent, débit. 2-3 tics visibles à l'image. Un objectif et un secret par personnage, qui créent des conflits entre eux.
- Univers 100 % inventé : aucun vrai joueur, club, ligue, stade, sponsor, logo, maillot reconnaissable, émission ou marque.
- 8 à 10 décors avec "desc" visuelle précise et fixe, et "son" (ambiance sonore).
- Saison : un enjeu clair en une phrase, 5 à 7 fils (2 au statut "cache" = secrets à révéler plus tard), et ${wiz.type==="unique"?"1 épisode":"10 à 12 épisodes"} avec chacun un format différent pris dans : ${(R0.formats_episode||[]).join(" | ")}.
- "serie_texte" : le ton et les règles d'écriture de la série en markdown (comment on parle, l'humour, ce qui rend addictif, ce qui est interdit).
- "recettes_texte" : en markdown, les mécaniques virales à appliquer, tirées du concept prouvé et des tendances.
- ids : minuscules sans accents ni espaces (ex : "kylian" interdit car trop proche d'un vrai joueur ; invente des prénoms neutres).

Réponds UNIQUEMENT en JSON :
{"nom":"…","style":"le style visuel complet","personnages":[{"id":"…","nom":"…","animal":"espèce ou forme","adn":"…","tenues":{"base":"…","chic":"…","nuit":"…"},"voix":"…","caractere":"…","tics":["…"],"replique_fetiche":"…","objectif":"…","secret":"…"}],"lieux":[{"id":"…","nom":"…","desc":"…","son":"…"}],"saison":{"saison":1,"enjeu":"…","fils":[{"id":"…","texte":"…","statut":"ouvert|cache"}],"episodes":[{"n":1,"format":"…","pitch":"…"}]},"serie_texte":"…","recettes_texte":"…"}`;
}

  const r=await sample(`Tu analyses une vidéo TikTok virale pour un studio qui fait des vidéos IA. Voici ${imgs.length} captures d'écran (dans l'ordre) et la note du créateur : « ${note||"aucune"} ».

  return r.text;
}

    <label class="f" for="r-bait">Appâts interdits (légende, commentaire)</label><textarea id="r-bait">${esc((c.appats_interdits||[]).join(", "))}</textarea>
    <label class="f" for="r-remp">Remplacements proposés (une ligne : mot = remplacement)</label>
    <textarea class="big" id="r-remp">${esc(Object.entries(c.remplacements||{}).map(([k,v])=>k+" = "+v).join("\n"))}</textarea>
    <div style="height:10px"></div><button class="btn small" id="saver">Enregistrer les listes</button></details></section>`;
  app.querySelectorAll("details[data-o]").forEach(d=>d.ontoggle=()=>{if(d.open)open[d.dataset.o]=1;else delete open[d.dataset.o]});
  const sv=document.getElementById("saver"); if(sv) sv.onclick=async()=>{const g=id=>document.getElementById(id).value;
    const rouge={}; g("r-rouge").split("\n").forEach(l=>{const i=l.indexOf(":");if(i>0)rouge[l.slice(0,i).trim()]=lines(l.slice(i+1))});
    const remp={}; g("r-remp").split("\n").forEach(l=>{const i=l.indexOf("=");if(i>0)remp[words(l.slice(0,i)).trim()]=l.slice(i+1).trim()});
    try{await db.collection("bible").doc("conformite").set({...c,rouge,orange:lines(g("r-orange")),insultes_maison:lines(g("r-maison")),appats_interdits:lines(g("r-bait")),remplacements:remp});toast("Listes enregistrées")}
    catch(e){toast("Enregistrement impossible")}};
}

/* ================== actions ================== */
async function upload(ep,n,file){
  if(!file||!assets) return;
  const key=`${ep.id}-${n}`; busy[key]=1; render();
  try{const type=file.type&&/^video\/(mp4|webm)$/.test(file.type)?file.type:"video/mp4";
    const r=await assets.upload(file,{type});
    await db.collection("clips").doc(`${ep.id}-${pad(n)}`).set({episode:ep.id,n,asset:r.id,taille:r.sizeBytes,date:new Date().toISOString()});
    toast(`Clip ${pad(n)} reçu`);
  }catch(e){toast(e.code==="too_large"?"Vidéo trop lourde (20 Mo max)":e.code==="unsupported_type"?"Format refusé : envoie un MP4":"Envoi raté, réessaie")}
  finally{delete busy[key]; render()}
}
async function askEpisode(){
  if(!db) return toast("Studio hors ligne");
  const idee=(document.getElementById("idee")?.value||"").trim();
  try{await db.collection("demandes").add({type:"episode",idee,statut:"en_attente",date:new Date().toISOString()});toast("Demande envoyée au PC")}
  catch(e){toast("Impossible d'envoyer la demande")}
}
async function askMonter(ep){
  try{await db.collection("demandes").add({type:"monter",episode:ep.id,statut:"en_attente",date:new Date().toISOString()});toast("Montage demandé")}
  catch(e){toast("Impossible d'envoyer la demande")}
}
async function saveFinal(ep,btn){
  if(!downloads) return toast("Enregistrement indisponible ici : appuie longuement sur la vidéo");
  btn.disabled=true; btn.textContent="Préparation…";
  try{const blob=await (await fetch("/_blob/"+ep.final)).blob();
    await downloads.save({filename:`laferme-partie-${pad(ep.numero)}.mp4`,data:blob}); toast("Vidéo enregistrée")}
  catch(e){if(e&&e.code!=="declined") toast("Enregistrement impossible")}
  finally{btn.disabled=false; btn.textContent="Enregistrer la vidéo"}
}

function route(){let h=location.hash.slice(1);if(/^ep\d{3}$/.test(h))h="e-"+h;view=/^(e|s|b)-[a-z0-9-]+$/.test(h)||["regles","tendances","nouveau"].includes(h)?h:"";confirmDel=null;render();window.scrollTo(0,0)}
backBtn.onclick=()=>{location.hash=backBtn.dataset.to||""};
addEventListener("hashchange",route);
// garde le focus et la saisie pendant les mises à jour en direct
function safeRender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&app.contains(a))return;render()}

(async()=>{
  const c=window.claude;
  if(!c||!c.use){app.innerHTML=`<div class="card empty"><h2>Studio hors ligne</h2><p class="mute">Ouvre cette page dans l'appli Claude ou sur claude.ai.</p></div>`;return}
  const timer=setTimeout(()=>{if(!episodes.length&&!G.realisation) app.innerHTML=`<div class="card empty"><h2>Connexion lente</h2><p class="mute">Le studio n'arrive pas encore. Vérifie ta connexion.</p></div>`},10000);
  [db,assets,downloads,sample]=await Promise.all([c.use("db"),c.use("assets"),c.use("downloads"),c.use("sample")]);
  if(!db){clearTimeout(timer);app.innerHTML=`<div class="card empty"><h2>Connecte-toi</h2><p class="mute">Le studio a besoin de ton compte Claude.</p></div>`;return}
  db.collection("bible").onSnapshot(s=>{clearTimeout(timer);G=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));bibleLoaded=!!G.realisation;setCur(cur);safeRender()},()=>{});
  db.collection("series").onSnapshot(s=>{series=s.docs.map(d=>({id:d.id,...d.data()}));setCur(cur);safeRender()},()=>{});
  db.collection("tendances").orderBy("date","desc").limit(60).onSnapshot(s=>{tendances=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},()=>{});
  if(sample){try{imgOK=!!(await sample.limits())?.images}catch(e){}}
  db.collection("episodes").orderBy("numero","desc").onSnapshot(s=>{clearTimeout(timer);episodes=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},()=>{});
  db.collection("clips").onSnapshot(s=>{clips=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));safeRender()},()=>{});
  db.collection("demandes").orderBy("date","desc").limit(50).onSnapshot(s=>{demandes=s.docs.map(d=>({id:d.id,...d.data()}));safeRender()},()=>{});
  route();
})();
</script>
